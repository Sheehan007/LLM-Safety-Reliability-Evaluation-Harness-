[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-safety-harness"
version = "0.1.0"
description = "Reproducible safety, reliability, and robustness evaluation for open-source LLMs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sheehan Mathur" }]
keywords = ["llm", "evaluation", "safety", "robustness", "hugging-face", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pandas>=2.1,<3"]

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
  "accelerate>=0.33,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
llm-harness = "llm_safety_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

